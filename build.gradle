plugins {
    id 'java'
    id 'application'
    id 'io.freefair.lombok' version '9.2.0'
}

repositories {
    mavenCentral()
}

def buildNumber = System.getenv("GITHUB_RUN_NUMBER")
if (buildNumber != null) {
    version = "v${project.version}+build.${buildNumber}"
} else {
    version = "v${project.version}"
}

lombok {
    version = lombok_version
}

application {
    mainClass = 'net.cjsah.slimefinder.Main'
}

jar {
    from("LICENSE")

    manifest {
        attributes(
                'Main-Class': application.mainClass
        )
    }

    doLast {
        def builtJarName = archiveFileName.get()
        copy {
            from("scripts")
            into(destinationDirectory)
            filteringCharset = 'UTF-8'
            // Replace placeholder token in script templates with the actual jar filename.
            filter { String line -> line.replace('$filename$', builtJarName) }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    it.options.release = 21
}