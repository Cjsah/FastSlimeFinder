name: Publish

on:
  release:
    types: [published]

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          skip-decompress: true
          name: 'Artifacts'
          path: dist

      - name: Rename artifact
        run: mv dist/Artifacts.zip dist/{{ github.event.release.tag_name }}.zip

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
